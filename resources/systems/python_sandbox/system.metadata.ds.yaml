version: 1

system:
  id: "python_sandbox"
  display_name: "Python Sandbox"
  what_it_does: "Execute Python code in a policy-driven sandbox and manage optional app-scoped virtual environments."
  use_cases:
    - "Run structured Python transforms from tool-calling workflows"
    - "Test data parsing and summarization logic in isolated execution"
    - "Create reusable managed virtual environments for YOLO workflows"
    - "Install runtime dependencies into managed environments"
    - "Run lightweight analysis and script-style automation safely"

capability_groups:
  - id: "diagnostics"
    name: "Worker diagnostics"
    description: "Verify worker availability and basic request/response health."
    tool_ids:
      - "mcp:plugin.python-tools-ds.python:python_tools.ping"
      - "mcp:plugin.python-tools-ds.python:rzn.worker.health"
      - "mcp:plugin.python-tools-ds.python:example.echo"

  - id: "managed_env_lifecycle"
    name: "Managed environment lifecycle"
    description: "List, create, and install dependencies into app-managed Python virtual environments."
    tool_ids:
      - "mcp:plugin.python-tools-ds.python:python_env.list"
      - "mcp:plugin.python-tools-ds.python:python_env.create"
      - "mcp:plugin.python-tools-ds.python:python_env.install"

  - id: "sandbox_execution"
    name: "Sandbox code execution"
    description: "Execute Python code with policy, runtime, timeout, and network controls."
    tool_ids:
      - "mcp:plugin.python-tools-ds.python:python_sandbox"

setup_steps:
  - id: "install_plugin"
    kind: "install"
    label: "Install a Python Tools plugin variant"
    description: "Install one of: minimal bundled runtime, system runtime only, or data-science bundled runtime."

  - id: "runtime_choice"
    kind: "runtime"
    label: "Choose Python runtime strategy"
    description: "Use `python_runtime` = `auto`, `bundled`, or `system` depending on your environment and policy needs."

  - id: "managed_env_optional"
    kind: "runtime"
    label: "Create a managed virtual environment (optional)"
    description: "For `policy_id=yolo`, create a named managed environment with `python_env.create` and install packages with `python_env.install`."
    optional: true

  - id: "health_check"
    kind: "connectivity"
    label: "Run worker health checks"
    description: "Call `rzn.worker.health` or `python_tools.ping` before first sandbox execution to validate startup wiring."

context_parameters:
  - id: "policy_id"
    label: "Security policy"
    kind: "enum"
    required: false
    default: "balanced"
    enum_values:
      - "yolo"
      - "balanced"
      - "data_science"
      - "document_processing"
      - "enterprise"

  - id: "python_runtime"
    label: "Python runtime"
    kind: "enum"
    required: false
    default: "auto"
    enum_values:
      - "auto"
      - "bundled"
      - "system"

  - id: "python_env"
    label: "Managed env alias"
    kind: "string"
    required: false

  - id: "timeout_seconds"
    label: "Execution timeout seconds"
    kind: "string"
    required: false
    default: "30"

  - id: "network_allowlist"
    label: "Network allowlist"
    kind: "string"
    required: false
    default: ""

quick_starts:
  - id: "health_probe"
    title: "Check worker health"
    description: "Validate the worker process and plugin wiring."
    tool_id: "mcp:plugin.python-tools-ds.python:rzn.worker.health"
    args: {}
    group_id: "diagnostics"

  - id: "list_envs"
    title: "List managed envs"
    description: "Show all managed Python environments currently available to this worker."
    tool_id: "mcp:plugin.python-tools-ds.python:python_env.list"
    args: {}
    group_id: "managed_env_lifecycle"

  - id: "create_demo_env"
    title: "Create demo env"
    description: "Create a managed environment alias named `demo` for iterative package installs."
    tool_id: "mcp:plugin.python-tools-ds.python:python_env.create"
    args:
      alias: "demo"
    group_id: "managed_env_lifecycle"

  - id: "run_hello_world"
    title: "Run hello world in sandbox"
    description: "Execute simple Python code with the default balanced policy."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "balanced"
      code: |
        print("hello from python sandbox")
        result = {"status": "ok", "value": 42}
      inputs: {}
    group_id: "sandbox_execution"

  - id: "run_basic_stats"
    title: "Run basic stats"
    description: "Execute a deterministic in-memory transform and return structured JSON."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "balanced"
      inputs:
        numbers: [12, 19, 7, 25, 14, 22]
      code: |
        numbers = inputs["numbers"]
        mean = sum(numbers) / len(numbers)
        result = {
          "count": len(numbers),
          "sum": sum(numbers),
          "mean": round(mean, 2),
          "min": min(numbers),
          "max": max(numbers)
        }
    group_id: "sandbox_execution"

  - id: "run_order_summary"
    title: "Summarize orders"
    description: "Group structured input into customer and regional revenue metrics."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "balanced"
      inputs:
        orders:
          - order_id: "A100"
            customer: "Acme"
            region: "NA"
            amount: 1200.0
          - order_id: "A101"
            customer: "Globex"
            region: "EU"
            amount: 850.0
          - order_id: "A102"
            customer: "Acme"
            region: "NA"
            amount: 640.0
          - order_id: "A103"
            customer: "Initech"
            region: "APAC"
            amount: 1430.0
      code: |
        orders = inputs["orders"]
        revenue_by_region = {}
        customer_totals = {}

        for order in orders:
          region = order["region"]
          revenue_by_region[region] = round(
            revenue_by_region.get(region, 0.0) + order["amount"], 2
          )

          customer = order["customer"]
          customer_totals[customer] = round(
            customer_totals.get(customer, 0.0) + order["amount"], 2
          )

        top_customer = max(customer_totals.items(), key=lambda item: item[1])
        largest_order = max(orders, key=lambda order: order["amount"])

        result = {
          "order_count": len(orders),
          "total_revenue": round(sum(order["amount"] for order in orders), 2),
          "average_order_value": round(
            sum(order["amount"] for order in orders) / len(orders), 2
          ),
          "top_customer": {"name": top_customer[0], "revenue": top_customer[1]},
          "largest_order_id": largest_order["order_id"],
          "revenue_by_region": revenue_by_region
        }
    group_id: "sandbox_execution"

  - id: "run_ds_plot_synthetic_orders"
    title: "Plot synthetic orders"
    description: "Render a deterministic matplotlib chart and return it as PNG bytes."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "data_science"
      inputs: {}
      code: |
        import io
        import numpy as np
        import matplotlib.pyplot as plt

        days = np.arange(7)
        orders = np.array([120, 128, 133, 129, 141, 150, 160])

        fig, ax = plt.subplots(figsize=(7, 3))
        ax.plot(days, orders, marker="o", linewidth=2)
        ax.set_title("Synthetic daily orders")
        ax.set_xlabel("Day")
        ax.set_ylabel("Orders")
        ax.grid(alpha=0.3)

        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=160, bbox_inches="tight")
        print(f"rendered {len(orders)} points")
        result = buf.getvalue()
    group_id: "sandbox_execution"

  - id: "run_ds_iris_classifier"
    title: "Train iris classifier"
    description: "Verify the bundled data-science runtime by fitting a small sklearn model."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "data_science"
      inputs: {}
      code: |
        from sklearn.datasets import load_iris
        from sklearn.linear_model import LogisticRegression

        iris = load_iris()
        X, y = iris.data, iris.target

        model = LogisticRegression(max_iter=200).fit(X, y)
        result = {
          "samples": int(X.shape[0]),
          "features": int(X.shape[1]),
          "classes": iris.target_names.tolist(),
          "training_accuracy": round(float(model.score(X, y)), 3)
        }
    group_id: "sandbox_execution"

  - id: "run_ds_usgs_quakes_chart"
    title: "Chart USGS earthquakes"
    description: "Fetch public earthquake data from an allowlisted host and render a histogram."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "data_science"
      network_allowlist:
        - "*.usgs.gov"
      inputs: {}
      code: |
        import io
        import json
        import urllib.request

        import matplotlib.pyplot as plt
        import pandas as pd

        url = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
        with urllib.request.urlopen(url, timeout=20) as response:
          feed = json.loads(response.read().decode("utf-8"))

        rows = []
        for feature in feed.get("features", []):
          props = feature.get("properties") or {}
          if props.get("mag") is not None:
            rows.append({"mag": props["mag"], "place": props.get("place", "unknown")})

        df = pd.DataFrame(rows)
        print(f"fetched {len(df)} earthquakes")

        fig, ax = plt.subplots(figsize=(7, 3))
        df["mag"].plot(kind="hist", bins=20, ax=ax, title="USGS earthquakes (last day)")
        ax.set_xlabel("Magnitude")
        ax.grid(alpha=0.3)

        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=160, bbox_inches="tight")
        result = buf.getvalue()
    group_id: "sandbox_execution"

  - id: "run_in_demo_env"
    title: "Run using managed env"
    description: "Execute code with `policy_id=yolo` and a managed env alias."
    tool_id: "mcp:plugin.python-tools-ds.python:python_sandbox"
    args:
      policy_id: "yolo"
      python_env: "demo"
      code: |
        import sys
        result = {"python": sys.version.split()[0]}
      inputs: {}
    group_id: "sandbox_execution"

result_handling:
  tools:
    "mcp:plugin.python-tools-ds.python:python_tools.ping":
      human_view:
        renderer: "summary"
      llm_view:
        include:
          - "content[0].text"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:rzn.worker.health":
      human_view:
        renderer: "key_value"
        fields:
          - "structuredContent.ok"
          - "structuredContent.worker"
          - "structuredContent.version"
      llm_view:
        include:
          - "structuredContent.ok"
          - "structuredContent.worker"
          - "structuredContent.version"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:example.echo":
      human_view:
        renderer: "summary"
      llm_view:
        include:
          - "content[0].text"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:python_env.list":
      human_view:
        renderer: "table"
        records_path: "structuredContent.envs[]"
        columns:
          - key: "alias"
            label: "Alias"
          - key: "healthy"
            label: "Healthy"
          - key: "python_path"
            label: "Python"
      llm_view:
        include:
          - "structuredContent.envs[].alias"
          - "structuredContent.envs[].healthy"
          - "structuredContent.envs[].python_path"
          - "structuredContent.envs_dir"
          - "isError"
        max_items: 100
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:python_env.create":
      human_view:
        renderer: "key_value"
        fields:
          - "structuredContent.alias"
          - "structuredContent.created"
          - "structuredContent.python_path"
      llm_view:
        include:
          - "structuredContent.alias"
          - "structuredContent.created"
          - "structuredContent.python_path"
          - "structuredContent.base_python"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:python_env.install":
      human_view:
        renderer: "summary"
      llm_view:
        include:
          - "structuredContent.alias"
          - "structuredContent.ok"
          - "structuredContent.stdout"
          - "structuredContent.stderr"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"

    "mcp:plugin.python-tools-ds.python:python_sandbox":
      human_view:
        renderer: "stack"
        sections:
          - title: "Summary"
            path: "content[0].text"
          - title: "Policy"
            path: "structuredContent.policy_id"
          - title: "Execution mode"
            path: "structuredContent.execution_mode"
          - title: "Output"
            path: "structuredContent.output"
      llm_view:
        include:
          - "structuredContent.policy_id"
          - "structuredContent.execution_mode"
          - "structuredContent.python"
          - "structuredContent.runtime"
          - "structuredContent.output.result"
          - "structuredContent.output.stdout"
          - "structuredContent.output.stderr"
          - "structuredContent.error"
          - "isError"
      index_view:
        mode: "none"
      debug_view:
        mode: "raw_json"
